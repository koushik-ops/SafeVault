# Development profile - uses local key management (NOT production-grade)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:securevault;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false

# Local key management for development only
kms:
  provider: local
  local-kek: ${LOCAL_KEK:3J8e6k8F9fQ0wR3tY5uI7oP9aS1dF3gH5jK7lZ9xC1v=}

logging:
  level:
    com.securevault: DEBUG
