server:
  port: 8080
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/securevault}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: true

# Supabase configuration (defaults prevent startup failure when testing locally)
supabase:
  url: ${SUPABASE_URL:https://placeholder.supabase.co}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:placeholder-service-role-key}
  jwt-secret: ${SUPABASE_JWT_SECRET:placeholder-jwt-secret-for-dev-minimum-32-chars-long}
  storage:
    bucket: ${SUPABASE_STORAGE_BUCKET:encrypted-backups}

# Encryption configuration
encryption:
  algorithm: AES/GCM/NoPadding
  key-size: 256
  nonce-size: 96
  tag-size: 128
  format-version: 1

# CORS
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Logging
logging:
  level:
    com.securevault: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
